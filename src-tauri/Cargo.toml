[package]
name = "flipdaw"
version = "0.9.5"
description = "FlipDAW - touch-first DAW / loop station"
authors = ["FlipDAW"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "flipdaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
